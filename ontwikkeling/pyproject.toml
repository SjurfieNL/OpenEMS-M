[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/"]

[tool.coverage.run]
branch = true
source = ["../addon_configs/a0d7b954_appdaemon/apps/OpenEMS-M"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
